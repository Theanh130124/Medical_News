<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Danh sách bác sĩ</title>
    <th:block th:replace="layout/base :: styles"></th:block>
</head>

<body>
<div th:replace="layout/header :: header"></div>




<section class="container mt-4">
    <h2 class="text-primary text-center mb-4">Chỉnh sửa thông tin bác sĩ</h2>



    <form th:action="@{'/doctors/edit/'+ ${doctor.id}}" th:object="${doctor}" method="post">

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

<!--        <div th:if="${success}" class="alert alert-success">-->
<!--            Cập nhật tài khoản bác sĩ thành công-->
<!--        </div>-->

        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Tên đăng nhập</label>
            <input type="text" th:field="*{username}" class="form-control" disabled/>
        </div>

        <div class="mb-3">
            <label>Họ</label>
            <input type="text" th:field="*{firstName}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Tên</label>
            <input type="text" th:field="*{lastName}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>SĐT</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Ngày sinh</label>
            <input type="date" th:field="*{dateOfBirth}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Địa chỉ</label>
            <input type="text" th:field="*{address}" class="form-control"/>
        </div>

        <input type="hidden" th:field="*{role}"/>

        <button type="submit" class="btn btn-success">Lưu</button>
        <a th:href="@{/doctors}" class="btn btn-secondary">Hủy</a>

    </form>

</section>
<div th:replace="layout/footer :: footer"></div>
</body>

</html>
