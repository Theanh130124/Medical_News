<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng ký bác sĩ</title>
    <th:block th:replace="layout/base :: styles"></th:block>
</head>

<body>
<div th:replace="layout/header :: header"></div>
<section class="container">
    <h2 class="text-center text-primary mt-4">Đăng ký bác sĩ</h2>
<!--    action tên của @PostMapping trong DoctorController-->


    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${success}" class="alert alert-success">
        Tạo tài khoản bác sĩ thành công.
    </div>

<!--th:fields thay thế cho name -> trong html -->
<!-- dùng th:fields nếu có lỗi (từ @Valid) trả ra đc -->
    <form th:action="@{/create_doctor}" th:object="${user}" method="post" enctype="multipart/form-data" class="mt-3">
        <div class="form-floating mb-3">
            <input type="text" th:field="*{username}" class="form-control" id="username" placeholder="Tên tài khoản">
            <label for="username">Tên tài khoản</label>
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="form-floating mb-3">
            <input type="text" th:field="*{firstName}" class="form-control" id="firstName" placeholder="Tên">
            <label for="username">Tên</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" th:field="*{lastName}" class="form-control" id="lastName" placeholder="Họ">
            <label for="username">Họ</label>
        </div>
        <div class="form-floating mb-3">
            <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Email">
            <label for="email">Email</label>
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-floating mb-3">
            <input type="text" th:field="*{phoneNumber}" class="form-control" id="phoneNumber" placeholder="Số điện thoại">
            <label for="phoneNumber">Số điện thoại</label>
            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>

        <div class="form-floating mb-3">
            <input type="date" th:field="*{dateOfBirth}" class="form-control" id="dateOfBirth" placeholder="Ngày sinh">
            <label for="dateOfBirth">Ngày sinh</label>
            <div class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
        </div>

        <div class="form-floating mb-3">
            <select th:field="*{gender}" class="form-select" id="gender">
                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
            </select>
            <label for="gender">Giới tính</label>
            <div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
        </div>


        <div class="form-floating mb-3">
            <input type="text" th:field="*{address}" class="form-control" id="address" placeholder="Địa chỉ">
            <label for="address">Địa chỉ</label>
            <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

<!--Nên hiện trên giao diện nói pass là username+@123-->
        <!--        <div class="form-floating mb-3">-->
<!--            <input type="password" th:field="*{password}" class="form-control"id="password" placeholder="Mật khẩu">-->
<!--            <label for="password">Mật khẩu</label>-->
<!--            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>-->
<!--        </div>-->



        <div class="mb-3">
            <label class="form-label">Ảnh đại diện</label>
            <input type="file" th:field="*{avatar}" class="form-control">
        </div>



        <button type="submit" class="btn btn-primary">Đăng ký</button>
    </form>
</section>

<div th:replace="layout/footer :: footer"></div>
</body>


</html>
